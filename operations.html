<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171914">
<meta name="description" content="DoomWatch Operations Room — connected Northern Ireland resilience intelligence.">
<title>DOOMWATCH // REGIONAL INTELLIGENCE</title>
<link rel="stylesheet" href="./doomwatch.css">
<style>
:root{--op-bg:#10140f;--op-panel:#1b211a;--op-line:#46513d;--op-gold:#e7c45a;--op-red:#c84d40;--op-green:#91bd79;--op-muted:#aab2a2}
body{background:var(--op-bg);color:#e8eadf;font-family:Consolas,Monaco,monospace}
.op-main{max-width:1500px;margin:auto;padding:12px}
.op-hero{padding:15px;background:linear-gradient(125deg,#283329,#101611);border:1px solid #68755c;border-top:4px solid var(--op-red);box-shadow:inset 0 1px #ffffff14}
.op-kicker{color:var(--op-gold);font-size:10px;letter-spacing:2px}
.op-hero h1{font-size:clamp(22px,5vw,34px);letter-spacing:2px;color:#f2d56e;margin:8px 0}
.op-hero p{max-width:900px;color:#c0c9b9;line-height:1.5;font-size:12px}
.op-stamp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.op-stamp span,.op-tag{border:1px solid #59674e;padding:5px 7px;color:#d8dfd0;font-size:10px}
.op-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.op-kpi{background:var(--op-panel);border:1px solid var(--op-line);border-top:3px solid #65734f;padding:11px;min-width:0}
.op-kpi strong{display:block;color:var(--op-gold);font-size:clamp(20px,5vw,29px);overflow-wrap:anywhere}
.op-kpi span{display:block;color:var(--op-muted);font-size:9px;letter-spacing:1px;margin-top:5px}
.op-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.op-panel{background:var(--op-panel);border:1px solid var(--op-line);padding:12px;min-width:0}
.op-panel h2{font-size:13px;color:var(--op-gold);letter-spacing:1.5px;border-bottom:1px solid #536044;padding-bottom:8px;margin:0 0 10px}
.op-panel h3{font-size:12px;color:#e4c77c;margin:8px 0}
.op-muted{color:var(--op-muted);font-size:10px;line-height:1.5}
.op-status{font-size:11px;padding:8px;background:#101710;border-left:3px solid var(--op-green);margin:8px 0;line-height:1.5}
.op-status.warn{border-left-color:#d2a64c}.op-status.bad{border-left-color:var(--op-red)}
.op-service{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #3b4738;padding:8px 0;font-size:11px}
.op-service b{color:#e9dfc2;text-align:right}
.op-controls{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
.op-controls input,.op-controls select{width:100%;background:#0c120d;color:#f5f3e8;border:1px solid #65734f;padding:10px;font:12px monospace}
.op-buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.op-buttons button{background:#303b2d;color:#eee;border:1px solid #8c805c;padding:8px 10px;font:10px monospace}
.op-buttons button[aria-pressed=true]{background:#7d342d;border-color:#e1a18b}
.op-event{background:#131a14;border:1px solid #45513e;border-left:4px solid #71835a;padding:11px;margin:8px 0;overflow-wrap:anywhere}
.op-event.high{border-left-color:var(--op-red)}.op-event.medium{border-left-color:#d6aa4d}
.op-event h3{margin:0 0 7px;font-size:13px;line-height:1.45;color:#f0d989}
.op-meta{font-size:10px;color:#aeb9a8;line-height:1.5;margin:6px 0}
.op-evidence{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.op-evidence span{font-size:9px;border:1px solid #5a674e;padding:4px 6px;color:#c9d2c0}
.op-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.op-links a{display:inline-block;background:#26342a;border:1px solid #65734f;padding:7px 8px;font-size:10px;color:#e4edda;text-decoration:none}
.op-links a:hover{border-color:var(--op-gold)}
.op-empty{padding:15px;color:var(--op-muted);font-size:11px;border:1px dashed #59644f}
.op-market{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.op-market>div{background:#101610;border:1px solid #3f4c3a;padding:9px;min-width:0}
.op-market strong{display:block;color:var(--op-gold);font-size:16px;overflow-wrap:anywhere}
.op-market span{display:block;color:var(--op-muted);font-size:9px;line-height:1.4;margin-top:4px}
.op-disclaimer{padding:10px;border:1px solid #755c3e;background:#211d15;color:#d6c7a6;font-size:10px;line-height:1.5;margin:12px 0}
.op-footer{padding:18px;text-align:center;color:#899483;font-size:9px;letter-spacing:1px}
@media(min-width:760px){.op-main{padding:18px}.op-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.op-grid{grid-template-columns:1.2fr .8fr}.op-controls{grid-template-columns:2fr 1fr 1fr}.op-market{grid-template-columns:repeat(2,1fr)}}

.op-timeline{display:grid;gap:9px;margin-top:10px}
.op-story{background:#121a14;border:1px solid #4a5845;border-left:4px solid #9c8755;padding:10px;min-width:0}
.op-story summary{cursor:pointer;list-style:none;color:#f0d989;font-size:12px;font-weight:700;line-height:1.45}
.op-story summary::-webkit-details-marker{display:none}
.op-story summary:after{content:"OPEN CHRONOLOGY +";display:block;color:#a8c58f;font-size:9px;font-weight:400;margin-top:5px}
.op-story[open] summary:after{content:"CLOSE CHRONOLOGY −"}
.op-story-meta{color:#aeb9a8;font-size:10px;line-height:1.5;margin:6px 0}
.op-chronology{border-left:2px solid #596b4f;margin:10px 0 0 5px;padding-left:12px;display:grid;gap:9px}
.op-chronology-item{position:relative;padding:7px;background:#1a241b;border:1px solid #394837}
.op-chronology-item:before{content:"";position:absolute;left:-18px;top:12px;width:8px;height:8px;border-radius:50%;background:#d6b574;border:1px solid #10140f}
.op-chronology-item strong{display:block;color:#e8d59c;font-size:11px;line-height:1.4}
.op-chronology-item .op-meta{margin:4px 0}
.op-timeline-note{font-size:10px;color:#aeb9a8;line-height:1.5}
#op-pathway-filters{margin:10px 0}
#op-pathway-filters button[aria-pressed="true"]{border-color:#e0b56c;background:#47351f;color:#fff}
.op-ledger-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px;margin-top:10px}
.op-ledger-card{min-width:0;padding:12px;background:#151d18;border:1px solid #4c5b4d;border-left:3px solid #b99a60;overflow-wrap:anywhere}
.op-ledger-card.report{border-left-color:#a9c48d}.op-ledger-card.comms{border-left-color:#7cb5c9}.op-ledger-card.market{border-left-color:#d5a65d}
.op-ledger-card h3{margin:0 0 6px;color:#ead19b;font-size:12px}
.op-ledger-meta{font-size:10px;color:#aebba9;line-height:1.5;margin:5px 0}
.op-ledger-card p{font-size:12px;line-height:1.45;margin:7px 0;color:#d7ded4}
.op-ledger-tag{display:inline-block;padding:3px 6px;margin:2px 3px 2px 0;border:1px solid #586554;color:#c6d5bd;font-size:9px;letter-spacing:.04em}
.op-ledger-note{padding:10px;border:1px dashed #56614e;color:#b8c4b2;font-size:11px;line-height:1.5;margin-top:8px}

.op-regional-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:9px;margin:10px 0}.op-region-card{background:#141c16;border:1px solid #4c5b4d;border-top:3px solid #7c9366;padding:11px;min-width:0;overflow-wrap:anywhere}.op-region-card.watch{border-top-color:#d2a64c}.op-region-card.multi{border-top-color:#c84d40}.op-region-card h3{margin:0 0 6px;color:#f0d989;font-size:12px}.op-region-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:8px 0}.op-region-stats span{background:#0d140f;padding:7px;font-size:9px;color:#aeb9a8}.op-region-stats b{display:block;color:#e7c45a;font-size:17px}.op-region-sector{display:inline-block;border:1px solid #53634f;padding:4px 6px;margin:2px;font-size:9px;color:#d4dfcc}#op-regional-filters button[aria-pressed=true]{background:#47351f;border-color:#e0b56c;color:#fff}#op-regional-filters [data-council]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderRegionalPicture();});
$("op-pathway-filters").addEventListener("click",e=>{const b=e.target.closest("button[data-pathway]");if(!b)return;evidencePathway=b.dataset.pathway;document.querySelectorAll("#op-pathway-filters [data-pathway]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderEvidenceLedger();});
$("op-evidence-filters").addEventListener("click",e=>{const b=e.target.closest("button[data-evidence]");if(!b)return;evidenceFilter=b.dataset.evidence;document.querySelectorAll("[data-evidence]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderEvents();});
const opParams=new URLSearchParams(location.search),initialSearch=opParams.get("search")||opParams.get("dw_title")||opParams.get("dw_area");if(initialSearch){$("op-search").value=initialSearch;}
load();setInterval(load,5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
</script>
<script src="./doomwatch-ui.js"></script>
</body>
</html>
