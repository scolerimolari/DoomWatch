name: DoomWatch Intelligence Collector

"on":
  push:
    branches:
      - main
    paths:
      - "collector.py"
      - "feeds.json"
      - "sources.json"
      - "manifest.json"
      - ".github/workflows/collector.yml"

  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: doomwatch-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate collector and source configuration
        run: |
          python -m py_compile collector.py
          python -m json.tool feeds.json > /dev/null
          python -m json.tool sources.json > /dev/null
          python -m json.tool manifest.json > /dev/null
          python -m py_compile markets_collector.py

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          for page in ("index.html", "markets.html", "household.html"):
              parser = ScriptExtractor()
              parser.feed(Path(page).read_text(encoding="utf-8"))
              if not parser.scripts:
                  raise SystemExit(f"No inline JavaScript found in {page}")
              for number, script in enumerate(parser.scripts, start=1):
                  Path(f"/tmp/{page}-{number}.js").write_text(script, encoding="utf-8")
                  print(f"Extracted {page} script {number}")
          PY
          node --check /tmp/index.html-1.js
          node --check /tmp/markets.html-1.js
          node --check /tmp/household.html-1.js

      - name: Run DoomWatch collector
        run: python collector.py

      - name: Save updated intelligence
        run: |
          git config user.name "DoomWatch Collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/intelligence.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DoomWatch intelligence"

            git pull --rebase origin main

            git push origin HEAD:main
          fi
