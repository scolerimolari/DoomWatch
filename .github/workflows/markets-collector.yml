name: DoomWatch Markets Collector

on:
  push:
    branches:
      - main
    paths:
      - "markets_collector.py"
      - ".github/workflows/markets-collector.yml"
      - "markets.html"
      - "household.html"

  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doomwatch-markets-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out DoomWatch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate markets collector
        run: python -m py_compile markets_collector.py

      - name: Collect market intelligence
        run: python markets_collector.py

      - name: Create compact grocery feed diagnostic
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("data/markets.json").read_text(encoding="utf-8"))
          basket = data.get("householdBasket") or {}
          history = basket.get("dailyProductPriceHistory") or []
          source = (data.get("sources") or {}).get("dailyGroceryBasket") or {}
          latest_date = basket.get("dailyProductPriceLatestDate") or ""
          latest = [
              row for row in history
              if str(row.get("date") or row.get("scrapedAt") or "")[:10] == latest_date
          ]
          counts = {}
          ean_rows = 0
          match_key_rows = 0
          match_key_only_rows = 0
          ean_identities = {}
          match_identities = {}
          for row in latest:
              retailer = str(row.get("retailer") or "Unknown")
              counts[retailer] = counts.get(retailer, 0) + 1

              raw_ean = row.get("ean") or []
              if not isinstance(raw_ean, list):
                  raw_ean = [raw_ean]
              eans = sorted(set(
                  "".join(ch for ch in str(value) if ch.isdigit())
                  for value in raw_ean
              ))
              eans = [value for value in eans if 8 <= len(value) <= 14]
              match_key = str(row.get("matchKey") or "").strip().casefold()

              if eans:
                  ean_rows += 1
                  for ean in eans:
                      ean_identities.setdefault(ean, set()).add(retailer)
              if match_key:
                  match_key_rows += 1
                  if not eans:
                      match_key_only_rows += 1
                  confidence = row.get("matchConfidence")
                  basis = str(row.get("matchBasis") or "").strip().casefold()
                  try:
                      confidence = float(confidence) if confidence is not None else None
                  except (TypeError, ValueError):
                      confidence = None
                  # Ignore explicitly weak or name-only source matches.
                  if (confidence is None or confidence >= 0.90) and basis != "name":
                      match_identities.setdefault(match_key, []).append({
                          "retailer": retailer,
                          "eans": set(eans),
                      })

          shared_ean_groups = sum(
              1 for retailers in ean_identities.values()
              if len(retailers) >= 2
          )
          # Conservative candidate identity: exact normalised name tokens
          # plus the same pack quantity. This is not proof of identical quality.
          ignored = {"the", "and", "of", "a", "an", "in", "to", "for"}
          retailer_prefix = re.compile(r"^(tesco|asda|sainsbury'?s|aldi|lidl)\s+", re.I)

          def pack_identity(row):
              raw = re.sub(r"\s+", "", str(row.get("packSize") or "").lower())
              if not raw:
                  found = re.search(
                      r"\b(\d+(?:\.\d+)?)(kg|g|ml|l|ltr|litre|litres|pack|pk|each)\b",
                      str(row.get("matchKey") or "").lower(),
                  )
                  if found:
                      raw = found.group(1) + found.group(2)
              found = re.fullmatch(
                  r"(\d+(?:\.\d+)?)(kg|g|ml|l|ltr|litre|litres|pack|pk|each)",
                  raw,
              )
              if not found:
                  return ""
              amount, unit = float(found.group(1)), found.group(2)
              if unit == "kg":
                  return "g:" + str(round(amount * 1000))
              if unit == "g":
                  return "g:" + str(round(amount))
              if unit in {"l", "ltr", "litre", "litres"}:
                  return "ml:" + str(round(amount * 1000))
              if unit == "ml":
                  return "ml:" + str(round(amount))
              return "each:" + str(round(amount))

          name_pack_identities = {}
          for row in latest:
              match_key = str(row.get("matchKey") or "").strip().lower()
              pack = pack_identity(row)
              if not match_key or not pack:
                  continue
              name = retailer_prefix.sub("", match_key)
              name = re.sub(
                  r"\b\d+(?:\.\d+)?\s*(?:kg|g|ml|l|ltr|litre|litres|pack|pk|each)\b",
                  " ",
                  name,
              )
              tokens = sorted({
                  token for token in re.sub(r"[^a-z0-9 ]", " ", name).split()
                  if len(token) > 1 and token not in ignored
              })
              if len(tokens) < 2:
                  continue
              identity = " ".join(tokens) + "|" + pack
              raw_ean = row.get("ean") or []
              if not isinstance(raw_ean, list):
                  raw_ean = [raw_ean]
              row_eans = {
                  "".join(ch for ch in str(value) if ch.isdigit())
                  for value in raw_ean
              }
              row_eans = {value for value in row_eans if 8 <= len(value) <= 14}
              name_pack_identities.setdefault(identity, []).append({
                  "retailer": str(row.get("retailer") or "Unknown"),
                  "eans": row_eans,
              })
          shared_name_pack_groups = 0
          for group in name_pack_identities.values():
              retailers = {item["retailer"] for item in group}
              known_eans = set().union(*(item["eans"] for item in group))
              if len(retailers) < 2 or len(known_eans) > 1:
                  continue
              if known_eans and all(item["eans"] for item in group):
                  continue
              shared_name_pack_groups += 1

          shared_match_key_groups = 0
          hybrid_match_key_groups = 0
          for group in match_identities.values():
              retailers = {row["retailer"] for row in group}
              if len(retailers) < 2:
                  continue
              known_eans = set().union(*(row["eans"] for row in group))
              # Conflicting barcodes are stronger evidence than a text key.
              if len(known_eans) > 1:
                  continue
              # If every row has the same barcode, the EAN already covers it.
              if known_eans and all(row["eans"] for row in group):
                  continue
              shared_match_key_groups += 1
              if known_eans:
                  hybrid_match_key_groups += 1

          report = {
              "generatedAt": data.get("updatedAt"),
              "source": source,
              "historyRows": len(history),
              "latestDate": latest_date,
              "latestRows": len(latest),
              "retailerCounts": counts,
              "eanRows": ean_rows,
              "matchKeyRows": match_key_rows,
              "matchKeyOnlyRows": match_key_only_rows,
              "sharedEanProductGroups": shared_ean_groups,
              "sharedMatchKeyProductGroups": shared_match_key_groups,
              "hybridMatchKeyProductGroups": hybrid_match_key_groups,
              "sharedNamePackProductGroups": shared_name_pack_groups,
          }
          Path("data/grocery-status.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit updated market history
        run: |
          git config user.name "DoomWatch Markets Collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/markets.json data/grocery-status.json

          if git diff --cached --quiet; then
            echo "No market data changes to commit"
            exit 0
          fi

          git commit -m "Update DoomWatch market intelligence"

          git pull --rebase origin main
          git push origin HEAD:main
