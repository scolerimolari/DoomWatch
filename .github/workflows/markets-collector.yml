name: DoomWatch Markets Collector

on:
  push:
    branches:
      - main
    paths:
      - "markets_collector.py"
      - ".github/workflows/markets-collector.yml"
      - "markets.html"
      - "household.html"

  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doomwatch-markets-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out DoomWatch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate markets collector
        run: python -m py_compile markets_collector.py

      - name: Collect market intelligence
        run: python markets_collector.py

      - name: Create compact grocery feed diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/markets.json").read_text(encoding="utf-8"))
          basket = data.get("householdBasket") or {}
          history = basket.get("dailyProductPriceHistory") or []
          source = (data.get("sources") or {}).get("dailyGroceryBasket") or {}
          latest_date = basket.get("dailyProductPriceLatestDate") or ""
          latest = [
              row for row in history
              if str(row.get("date") or row.get("scrapedAt") or "")[:10] == latest_date
          ]
          counts = {}
          ean_rows = 0
          match_key_rows = 0
          match_key_only_rows = 0
          ean_identities = {}
          match_identities = {}
          for row in latest:
              retailer = str(row.get("retailer") or "Unknown")
              counts[retailer] = counts.get(retailer, 0) + 1

              raw_ean = row.get("ean") or []
              if not isinstance(raw_ean, list):
                  raw_ean = [raw_ean]
              eans = sorted(set(
                  "".join(ch for ch in str(value) if ch.isdigit())
                  for value in raw_ean
              ))
              eans = [value for value in eans if 8 <= len(value) <= 14]
              match_key = str(row.get("matchKey") or "").strip().casefold()

              if eans:
                  ean_rows += 1
                  for ean in eans:
                      ean_identities.setdefault(ean, set()).add(retailer)
              if match_key:
                  match_key_rows += 1
                  match_identities.setdefault(match_key, []).append({
                      "retailer": retailer,
                      "eans": set(eans),
                  })
                  if not eans:
                      match_key_only_rows += 1

          shared_ean_groups = sum(
              1 for retailers in ean_identities.values()
              if len(retailers) >= 2
          )
          shared_match_key_groups = 0
          hybrid_match_key_groups = 0
          for group in match_identities.values():
              retailers = {row["retailer"] for row in group}
              if len(retailers) < 2:
                  continue
              known_eans = set().union(*(row["eans"] for row in group))
              # Conflicting barcodes are stronger evidence than a text key.
              if len(known_eans) > 1:
                  continue
              # If every row has the same barcode, the EAN already covers it.
              if known_eans and all(row["eans"] for row in group):
                  continue
              shared_match_key_groups += 1
              if known_eans:
                  hybrid_match_key_groups += 1

          report = {
              "generatedAt": data.get("updatedAt"),
              "source": source,
              "historyRows": len(history),
              "latestDate": latest_date,
              "latestRows": len(latest),
              "retailerCounts": counts,
              "eanRows": ean_rows,
              "matchKeyRows": match_key_rows,
              "matchKeyOnlyRows": match_key_only_rows,
              "sharedEanProductGroups": shared_ean_groups,
              "sharedMatchKeyProductGroups": shared_match_key_groups,
              "hybridMatchKeyProductGroups": hybrid_match_key_groups,
          }
          Path("data/grocery-status.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit updated market history
        run: |
          git config user.name "DoomWatch Markets Collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/markets.json data/grocery-status.json

          if git diff --cached --quiet; then
            echo "No market data changes to commit"
            exit 0
          fi

          git commit -m "Update DoomWatch market intelligence"

          git pull --rebase origin main
          git push origin HEAD:main
